<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <circle cx="60" cy="60" r="56" fill="#0D1220" stroke="#F2B84B" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#2E3A56" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="60" cy="60" r="44" fill="#141A2A" stroke="#F2B84B" stroke-width="1.5"/>
  
  <!-- Magnifying glass with table rows inside -->
  <g transform="translate(42, 38)">
    <circle cx="16" cy="16" r="14" fill="#1B2336" stroke="#F2B84B" stroke-width="2.5"/>
    <!-- table grid rows inside lens -->
    <line x1="7" y1="11" x2="25" y2="11" stroke="#34D39E" stroke-width="1.75" stroke-linecap="round"/>
    <line x1="7" y1="16" x2="25" y2="16" stroke="#8FD3F5" stroke-width="1.75" stroke-linecap="round"/>
    <line x1="7" y1="21" x2="21" y2="21" stroke="#F2B84B" stroke-width="1.75" stroke-linecap="round"/>
    <!-- handle -->
    <line x1="26" y1="26" x2="36" y2="36" stroke="#F2B84B" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Circular path for text -->
  <path id="textPath" d="M 60,60 m -36,0 a 36,36 0 1,1 72,0 a 36,36 0 1,1 -72,0" fill="none"/>
  <text font-family="'Big Shoulders Display', sans-serif" font-size="7.5" font-weight="800" fill="#E9EDF5" letter-spacing="0.16em">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      DIVISI INVESTIGASI DATA • WIRALAGA
    </textPath>
  </text>
</svg>